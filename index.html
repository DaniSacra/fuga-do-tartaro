<script>
'use strict';
/* =====================================================================
 * FUGA DO TÁRTARO — isometric action roguelite (single file, Phaser 3)
 * Sections: 1) data/config  2) pure logic + tests  3) texture generation
 *           4) entities     5) scenes               6) bootstrap
 * ===================================================================== */

// ---------------------------------------------------------------------
// 1) DATA / BALANCE CONFIG (tweak here)
// ---------------------------------------------------------------------
const W = 960, H = 540;
const WORLD = { w: 1600, h: 1000, cx: 800, cy: 520, A: 640, B: 340 }; // diamond arena half-extents
const ISO = 0.55;                       // vertical squash for ground circles
const URLP = new URLSearchParams(location.search);
const FX_ON = URLP.get('fx') !== '0';   // ?fx=0 disables postFX (slow GPUs)
const FONT = "'Palatino Linotype','Book Antiqua',Palatino,'URW Palladio L','Times New Roman',Georgia,serif";

const PAL = {
  outline: '#0d0812', bg: '#1b1326', stone: '#2a1f3d', ghost: '#5b4b8a', crimson: '#b3261e',
  fire: '#ffb703', teal: '#2ec4b6', spectral: '#a6ff4d',
};
const HEX = { fire: 0xffb703, teal: 0x2ec4b6, spectral: 0xa6ff4d, crimson: 0xb3261e, danger: 0xff3b30, gold: 0xffd24a, ghost: 0x5b4b8a };

const PLAYER_CFG = {

  dashSpeed: 760, dashTime: 0.17, dashIframes: 0.27, dashCharges: 2, dashRecharge: 1.2,

  combo: [

    { dmg: 20, time: 0.24, hitAt: 0.08, range: 74, arc: 2.0, lunge: 150, knock: 110 },

  ],

const CRIT_MULT = 2;

const ENEMY_CFG = {
  hoplite: { name: 'Sombra hoplita', tex: 'hoplite', frame: 48, feet: 42, scale: 1.5, radius: 11,
    hp: 70, speed: 96, dmg: 12, range: 80, windup: 0.55, strikeTime: 0.16, recover: 0.7, cooldown: 0.5,
    thrustDist: 115, walk: 'hoplite-walk', death: 'hoplite-death' },

    hp: 45, speed: 82, dmg: 10, keepMin: 200, keepMax: 330, windup: 0.6, strikeTime: 0.12, recover: 0.4,
    cooldown: 1.9, projSpeed: 185, walk: 'archer-walk', death: 'archer-death' },
  brute: { name: 'Brutamontes de pedra', tex: 'brute', frame: 64, feet: 58, scale: 1.5, radius: 15, heavy: true,
    hp: 190, speed: 56, dmg: 22, range: 78, windup: 0.95, strikeTime: 0.2, recover: 1.1, cooldown: 0.6,
    aoe: 108, walk: 'brute-walk', death: 'brute-death' },
};

const BOSS_CFG = {
  name: 'QUIMERA', title: 'Flagelo do Tártaro', tex: 'chimera', frame: 128, feet: 108, scale: 1.4, radius: 26, heavy: true,
  hp: 2300, speed: 62, phase2At: 0.5,
  charge: { windup: 0.8, windupFast: 0.42, speed: 700, time: 0.72, dmg: 22, width: 76, hitR: 56 },
  breath: { windup: 0.75, time: 0.95, dmg: 13, tick: 0.25, range: 270, half: 0.52 },
  tail: { windup: 0.6, dmg: 18, radius: 135 },
  venom: { windup: 0.5, speed: 235, dmg: 11, count: 5, spread: 0.9 },
  floor: { windup: 0.6, delay: 1.0, burn: 3.2, dmg: 10, radius: 54 },
  idle: [0.9, 0.5],
};

const RARITIES = {
  common: { label: 'Comum', mult: 1, weight: 60, color: '#c9c9d6', order: 0 },
  rare: { label: 'Rara', mult: 1.5, weight: 30, color: '#4da6ff', order: 1 },
  epic: { label: 'Épica', mult: 2.2, weight: 10, color: '#c77dff', order: 2 },
};

const BOONS = {
  zeus: { god: 'Zeus', title: 'Fúria do Trovão', icon: 'icon-zeus', color: 0x2a5bd7, base: 9,
    desc: s => `Seus golpes disparam raios em cadeia: ${s.chainDmg} de dano em até ${s.chainJumps} inimigos.` },
  ares: { god: 'Ares', title: 'Lâmina Sangrenta', icon: 'icon-ares', color: 0x8a1414, base: 6,
    desc: s => `Seus golpes aplicam sangramento: ${s.bleedDps} de dano por segundo durante ${s.bleedTime}s.` },
  artemis: { god: 'Ártemis', title: 'Mira da Caçadora', icon: 'icon-artemis', color: 0x2f8f4e, base: 0.15,
    desc: s => `${Math.round(s.critChance * 100)}% de chance de acerto crítico (dano x${CRIT_MULT}).` },
  hermes: { god: 'Hermes', title: 'Passo Alado', icon: 'icon-hermes', color: 0xf08a24, base: 0.12,
    desc: s => `+${Math.round((s.speedMult - 1) * 100)}% de velocidade e +1 carga de dash.` },
  athena: { god: 'Atena', title: 'Égide Divina', icon: 'icon-athena', color: 0xa8743a, base: 22,
    desc: s => `O dash reflete projéteis (${s.reflectDmg} de dano) e você sofre ${Math.round(s.damageReduction * 100)}% menos dano.` },
};

// Room sequence. Props use diamond coords (u,v) in [-1,1].
const COLS_A = [[-0.45, -0.45], [0.45, -0.45], [-0.45, 0.45], [0.45, 0.45]];
const COLS_B = [[0, -0.5], [0, 0.5], [-0.55, 0], [0.55, 0], [0.5, 0.5]];
const COLS_C = [[-0.3, -0.6], [0.3, -0.6], [-0.6, 0.3], [0.6, 0.3], [0, 0.15]];
const ROOMS = [
  { type: 'combat', columns: COLS_A, waves: [{ hoplite: 3 }, { hoplite: 3, archer: 1 }] },
  { type: 'combat', columns: COLS_B, waves: [{ hoplite: 2, archer: 2 }, { hoplite: 3, archer: 2 }] },
  { type: 'fountain', columns: COLS_A, healPct: 0.3 },
  { type: 'combat', columns: COLS_C, waves: [{ hoplite: 2, brute: 1 }, { hoplite: 2, archer: 2, brute: 1 }] },
  { type: 'combat', columns: COLS_A, waves: [{ hoplite: 3, archer: 2, brute: 1 }, { hoplite: 2, archer: 3, brute: 2 }] },
  { type: 'boss', columns: [] },
];
const BRAZIERS = [[-0.28, -0.9], [0.28, -0.9], [0.9, -0.35], [0.9, 0.35], [-0.9, -0.35], [-0.9, 0.35], [-0.45, 0.9], [0.45, 0.9]];
const TOTAL_NUMBERED = ROOMS.filter(r => r.type !== 'fountain').length;

// ---------------------------------------------------------------------
// 2) PURE LOGIC (unit-tested with ?test=1)
// ---------------------------------------------------------------------
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function boonPower(rarity, level) { return RARITIES[rarity].mult * (1 + 0.5 * (level - 1)); }
function boonStats(boons) {
  const p = id => boons[id] ? boonPower(boons[id].rarity, boons[id].level) : 0;
  return {
    chainDmg: Math.round(BOONS.zeus.base * p('zeus')), chainJumps: boons.zeus ? 2 + boons.zeus.level : 0,
    bleedDps: Math.round(BOONS.ares.base * p('ares')), bleedTime: 3,
    critChance: Math.min(0.75, BOONS.artemis.base * p('artemis')),
    speedMult: 1 + Math.min(0.6, BOONS.hermes.base * p('hermes')), extraDash: boons.hermes ? 1 : 0,
    reflect: !!boons.athena, reflectDmg: Math.round(BOONS.athena.base * p('athena')),
    damageReduction: Math.min(0.5, 0.08 * p('athena')),
  };
}
/** Final damage for one hit. `roll` is a uniform [0,1) number. */
function computeDamage({ base, critChance = 0, critMult = CRIT_MULT, roll = 1, mult = 1 }) {
  const crit = roll < critChance;
  return { amount: Math.max(1, Math.round(base * mult * (crit ? critMult : 1))), crit };
}
function reduceDamage(amount, reduction) { return Math.max(1, Math.round(amount * (1 - reduction))); }
function rollRarity(rng) {
  const total = Object.values(RARITIES).reduce((s, r) => s + r.weight, 0);
  let x = rng() * total;
  for (const [id, r] of Object.entries(RARITIES)) { if ((x -= r.weight) < 0) return id; }
  return 'common';
}
/** Draws `count` distinct boon offers; owned boons come back as upgrades. */
function rollBoonChoices(owned, count, rng) {
  const ids = Object.keys(BOONS);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  return ids.slice(0, count).map(id => {
    const rolled = rollRarity(rng), have = owned[id];
    if (!have) return { id, rarity: rolled, level: 1, upgrade: false };
    const rarity = RARITIES[rolled].order > RARITIES[have.rarity].order ? rolled : have.rarity;
    return { id, rarity, level: have.level + 1, upgrade: true };
  });
}
function applyBoonChoice(owned, choice) {
  return Object.assign({}, owned, { [choice.id]: { rarity: choice.rarity, level: choice.level } });
}
function inEllipse(px, py, x, y, r) { const dx = px - x, dy = (py - y) / ISO; return dx * dx + dy * dy <= r * r; }
function angleDiff(a, b) { let d = a - b; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return Math.abs(d); }
function uvToWorld(u, v) { return { x: WORLD.cx + (u - v) * WORLD.A / 2, y: WORLD.cy + (u + v) * WORLD.B / 2 }; }

function runTests() {
  const results = []; let failed = 0;
  const t = (name, cond) => { results.push({ teste: name, ok: !!cond }); if (!cond) failed++; };
  t('dano base sem crítico', computeDamage({ base: 20, critChance: 0.5, roll: 0.9 }).amount === 20);
  t('dano crítico dobra', (() => { const r = computeDamage({ base: 20, critChance: 0.5, roll: 0.1 }); return r.crit && r.amount === 40; })());
  t('dano mínimo é 1', computeDamage({ base: 0.1 }).amount === 1);
  t('multiplicador aplicado', computeDamage({ base: 10, mult: 1.5 }).amount === 15);
  t('redução de dano', reduceDamage(20, 0.25) === 15 && reduceDamage(1, 0.9) === 1);
  t('poder cresce com raridade', boonPower('epic', 1) > boonPower('rare', 1) && boonPower('rare', 1) > boonPower('common', 1));
  t('poder cresce com nível', boonPower('common', 3) > boonPower('common', 2));
  const rng = mulberry32(42);
  const c1 = rollBoonChoices({}, 3, rng);
  t('sorteio retorna 3 cartas', c1.length === 3);
  t('cartas são distintas', new Set(c1.map(c => c.id)).size === 3);
  t('cartas novas começam no nível 1', c1.every(c => c.level === 1 && !c.upgrade));
  const owned = { zeus: { rarity: 'epic', level: 2 }, ares: { rarity: 'common', level: 1 }, artemis: { rarity: 'rare', level: 1 }, hermes: { rarity: 'common', level: 1 }, athena: { rarity: 'common', level: 1 } };
  const c2 = rollBoonChoices(owned, 3, mulberry32(7));
  t('bênção repetida vira aprimoramento', c2.every(c => c.upgrade && c.level === owned[c.id].level + 1));
  t('aprimoramento nunca reduz raridade', c2.every(c => RARITIES[c.rarity].order >= RARITIES[owned[c.id].rarity].order));
  const after = applyBoonChoice({}, c1[0]);
  t('applyBoonChoice é puro', after[c1[0].id].level === 1 && Object.keys({}).length === 0);
  const counts = { common: 0, rare: 0, epic: 0 }; const r2 = mulberry32(99);
  for (let i = 0; i < 3000; i++) counts[rollRarity(r2)]++;
  t('distribuição de raridade', counts.common > counts.rare && counts.rare > counts.epic && counts.epic > 150);
  const s = boonStats({ hermes: { rarity: 'common', level: 1 }, artemis: { rarity: 'epic', level: 9 } });
  t('stats de Hermes', s.extraDash === 1 && Math.abs(s.speedMult - 1.12) < 1e-9);
  t('crítico tem teto', s.critChance === 0.75);
  t('stats vazios são neutros', (() => { const z = boonStats({}); return z.critChance === 0 && z.speedMult === 1 && !z.reflect && z.chainJumps === 0; })());
  t('elipse isométrica', inEllipse(50, 0, 0, 0, 60) && !inEllipse(0, 50, 0, 0, 60));
  t('diferença angular', Math.abs(angleDiff(3.1, -3.1) - (2 * Math.PI - 6.2)) < 1e-9);
  console.table(results);
  console.log(`%c[Fuga do Tártaro] testes: ${results.length - failed}/${results.length} passaram`, `color:${failed ? 'red' : 'green'};font-weight:bold`);
  return { total: results.length, failed };
}

// ---------------------------------------------------------------------
// 3) PROCEDURAL TEXTURES
//    Every texture lives in the SHEETS manifest. To swap for a PNG later,
//    add `url: 'assets/kyra.png'` to an entry: Boot loads the file with the
//    same key and frame size and skips the generator.
// ---------------------------------------------------------------------
const OUT = PAL.outline;
function poly(c, pts, fill, lw = 2.2) {
  c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.closePath(); c.fillStyle = fill; c.fill();
  if (lw) { c.lineWidth = lw; c.strokeStyle = OUT; c.lineJoin = 'round'; c.stroke(); }
}
function ell(c, x, y, rx, ry, fill, lw = 2.2, rot = 0) {
  c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2);
  c.fillStyle = fill; c.fill();
  if (lw) { c.lineWidth = lw; c.strokeStyle = OUT; c.stroke(); }
}
function stroke(c, pts, color, w) {
  c.beginPath(); c.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i + 1]);
  c.lineWidth = w; c.strokeStyle = color; c.lineCap = 'round'; c.lineJoin = 'round'; c.stroke();
}
function oline(c, pts, color, w) { stroke(c, pts, OUT, w + 3); stroke(c, pts, color, w); }
function spiky(c, cx, cy, rIn, rOut, n, rot, fill, lw = 2.2) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? rIn : rOut, a = rot + i * Math.PI / n;
    pts.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  poly(c, pts, fill, lw);
}
function soft(c, x, y, r, rgb, a = 1) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}
const S = Math.sin, PI2 = Math.PI * 2;

// ---- Kyra (48x48) ----------------------------------------------------
function drawKyra(c, p) {
  const P = Object.assign({ bob: 0, leg: 0, cape: 0, sword: -0.7, lean: 0, hair: 0, alpha: 1, fall: 0, trail: 0, x: 0 }, p);
  if (P.trail) { drawKyra(c, { ...P, trail: 0, alpha: 0.18, x: -12 }); drawKyra(c, { ...P, trail: 0, alpha: 0.38, x: -6 }); }
  c.save(); c.globalAlpha = P.alpha;
  c.translate(P.x + P.fall * 13, 0);
  c.translate(24, 42); c.rotate(-P.fall * 1.45); c.translate(-24, -42);
  c.translate(P.lean * 2.2, P.bob);
  const w = P.cape, l = P.leg;
  // cape (crimson, two tones)
  poly(c, [19, 17, 27, 18, 22, 33, 12 + w * 1.5, 39 + w * 0.6, 4 - w * 2.2, 35 - w * 1.6, 9 - w * 1.5, 25], '#b3261e');
  poly(c, [19, 19, 22, 33, 12 + w * 1.5, 39 + w * 0.6, 13 - w, 28], '#7d1712', 0);
  // legs
  poly(c, [20, 33, 24, 33, 23 + l * 4, 42 - Math.max(0, l) * 2, 19 + l * 4, 42 - Math.max(0, l) * 2], '#2a1840');
  poly(c, [24, 33, 28, 33, 28 - l * 4, 42 - Math.max(0, -l) * 2, 24 - l * 4, 42 - Math.max(0, -l) * 2], '#3a2456');
  // tunic + gold belt
  poly(c, [18, 19, 29, 19, 30, 35, 17, 35], '#3a2456');
  poly(c, [18.5, 20, 22, 20, 21, 34, 18, 34], '#2a1840', 0);
  poly(c, [17, 28.5, 30, 28.5, 30, 31.5, 17, 31.5], '#ffb703', 1.4);
  // head
  ell(c, 24, 13, 5.8, 5.8, '#e9b98f');
  ell(c, 26.6, 13, 1, 1.3, OUT, 0);
  // turquoise flame hair
  const h = P.hair;
  poly(c, [18, 15, 16, 9, 11 - h * 2, 6 + h, 17, 6, 17 + h, 1.5, 22, 5, 26 - h, 2, 28, 7, 30, 11, 26, 9, 21, 10], '#2ec4b6');
  poly(c, [19, 9, 18 + h, 5, 22, 7, 25, 5.5, 26, 8, 22, 8.5], '#8ff0e6', 0);
  // sword arm
  const a = P.sword, sx = 27, sy = 22, hx = sx + Math.cos(a) * 6, hy = sy + Math.sin(a) * 6;
  oline(c, [sx, sy, hx, hy], '#e9b98f', 2.6);
  const tx = hx + Math.cos(a) * 14, ty = hy + Math.sin(a) * 14;
  oline(c, [hx, hy, tx, ty], '#ffd24a', 2.4);
  stroke(c, [hx + Math.cos(a) * 4, hy + Math.sin(a) * 4, tx, ty], '#fff3b0', 1);
  const gx = Math.cos(a + Math.PI / 2) * 3.2, gy = Math.sin(a + Math.PI / 2) * 3.2;
  oline(c, [hx + Math.cos(a) * 2 - gx, hy + Math.sin(a) * 2 - gy, hx + Math.cos(a) * 2 + gx, hy + Math.sin(a) * 2 + gy], '#b8860b', 1.6);
  c.restore();
}
function kyraFrame(c, i) {
  if (i < 4) return drawKyra(c, { bob: [0, -0.6, 0, 0.5][i], cape: S(i * 1.57) * 0.6, hair: [0, 1, 0, -1][i] });
  if (i < 10) { const k = (i - 4) / 6 * PI2; return drawKyra(c, { leg: S(k), bob: -Math.abs(S(k)) * 1.6, cape: 1.4 + S(k * 2) * 0.6, lean: 0.7, hair: S(k * 2), sword: -0.4 + S(k) * 0.25 }); }
  if (i < 13) return drawKyra(c, { sword: [-2.3, -0.2, 0.9][i - 10], lean: [0.2, 1, 1][i - 10], cape: 1, leg: 0.4 });
  if (i < 16) return drawKyra(c, { sword: [1.0, 0, -1.9][i - 13], lean: [0.2, 1, 1][i - 13], cape: 1, leg: -0.4 });
  if (i < 19) return drawKyra(c, { sword: [-2.7, -0.4, 1.2][i - 16], lean: [-0.4, 1.6, 1.6][i - 16], cape: [0, 2, 1.5][i - 16], leg: 0.7, bob: [-1.5, 0, 0.5][i - 16] });
  if (i < 22) return drawKyra(c, { lean: 2, cape: 2.2 + (i - 19) * 0.3, leg: 0.9, trail: 1, sword: 2.6, hair: 2, bob: 1 });
  if (i < 24) return drawKyra(c, { lean: -1.4, sword: 1.1, cape: -0.8, bob: i - 22, hair: -1 });
  const k = (i - 24) / 4; return drawKyra(c, { fall: 0.2 + k * 0.8, sword: 1.2 + k, alpha: i === 28 ? 0.6 : 1, cape: -k });
}

// ---- Hoplite shade (48x48) --------------------------------------------
function ghostSmoke(c, d, rgb) {
  for (let n = 0; n < 5; n++) soft(c, 14 + n * 5 + S(n * 2.1) * 3, 34 - d * 26 - n * 2 * d, 5 + d * 7, rgb, 0.5 * (1 - d * 0.6));
}
function drawHoplite(c, p) {
  const P = Object.assign({ bob: 0, wave: 0, thrust: 0, wind: 0, dissolve: 0 }, p), d = P.dissolve;
  c.save();
  if (d) { ghostSmoke(c, d, '120,100,170'); c.globalAlpha = Math.max(0, 1 - d * 1.15); c.translate(0, -d * 6); }
  c.translate(0, P.bob);
  const wv = P.wave * 2, sx = P.thrust * 9 - P.wind * 6;
  // spear behind body
  oline(c, [12 + sx, 29, 38 + sx, 26], '#8a6a3a', 1.8);
  poly(c, [38 + sx, 23.5, 45 + sx, 25.5, 38 + sx, 28.5], '#d8d8e8', 1.5);
  // spectral body with wavy hem
  poly(c, [16, 20, 32, 20, 34, 35, 31 + wv, 42, 27, 37 - wv, 24, 43, 20, 37 + wv, 16 - wv, 42, 14, 35], '#5b4b8a');
  poly(c, [16.5, 21, 21, 21, 20, 36 + wv, 16 - wv, 40, 15, 35], '#43366b', 0);
  poly(c, [27, 21, 31, 21, 32.5, 34, 30, 38], '#7566a8', 0);
  // helmet (bronze) with face slit and green eyes
  ell(c, 24, 14, 8, 8, '#b87333');
  poly(c, [17, 13, 20, 8, 22, 12, 20, 15], '#7d4a1c', 0);
  poly(c, [22, 12, 31, 12, 31, 18, 27, 20, 25, 16, 22, 16], '#1a0f24', 1.2);
  c.shadowColor = '#a6ff4d'; c.shadowBlur = 4;
  ell(c, 25.5, 14.2, 1.3, 1.3, '#a6ff4d', 0); ell(c, 29, 14.2, 1.3, 1.3, '#a6ff4d', 0);
  c.shadowBlur = 0;
  poly(c, [16, 9, 19, 3, 26, 1.5, 32, 5, 30, 8, 24, 5.5, 19, 9.5], '#b3261e');
  // shield

function drawArena(c) {

  c.fillStyle = PAL.bg; c.fillRect(0, 0, w, h);

  poly(c, dia(A + 82, B + 48), '#b3261e', 0);
  c.save(); c.beginPath(); const lv = dia(A + 82, B + 48); c.moveTo(lv[0], lv[1]); for (let i = 2; i < 8; i += 2) c.lineTo(lv[i], lv[i + 1]); c.closePath(); c.clip();

    const t = rng() * PI2, k = 0.86 + rng() * 0.2, x = cx + Math.cos(t) * (A + 60) * k * (1 / (Math.abs(Math.cos(t)) + Math.abs(S(t)))), y = cy + S(t) * (B + 34) * k * (1 / (Math.abs(Math.cos(t)) + Math.abs(S(t))));

  for (let i = 0; i < 70; i++) {
    const t = rng() * PI2, q = 1 / (Math.abs(Math.cos(t)) + Math.abs(S(t))), x = cx + Math.cos(t) * (A + 56) * q, y = cy + S(t) * (B + 32) * q;
    ell(c, x, y, 5 + rng() * 9, 2.5 + rng() * 4, '#ffe066', 0);
  }
  c.restore();
  // floor side wall + top
  poly(c, dia(A + 6, B + 4, 18), '#150e20', 4);
  poly(c, dia(A + 6, B + 4), PAL.stone, 4);
  c.save(); c.beginPath(); const fl = dia(A + 4, B + 2); c.moveTo(fl[0], fl[1]); for (let i = 2; i < 8; i += 2) c.lineTo(fl[i], fl[i + 1]); c.closePath(); c.clip();
  const tw = 96, th = tw * B / A, n = Math.ceil(A / tw * 2) + 1, shades = ['#2a1f3d', '#2f2345', '#251b36', '#2c2141', '#33264a'];
  for (let i = -n; i <= n; i++) for (let j = -n; j <= n; j++) {
    const x = cx + (i - j) * tw / 2, y = cy + (i + j) * th / 2;
    if (Math.abs(x - cx) / (A + tw) + Math.abs(y - cy) / (B + th) > 1) continue;
    poly(c, [x, y - th / 2, x + tw / 2, y, x, y + th / 2, x - tw / 2, y], shades[Math.floor(rng() * shades.length)], 2.5);
    stroke(c, [x - tw / 2 + 5, y - 1, x, y - th / 2 + 3], 'rgba(140,120,190,0.25)', 1.5);
    if (rng() < 0.3) { const ox = (rng() - 0.5) * 30, oy = (rng() - 0.5) * 14; stroke(c, [x + ox, y + oy, x + ox + 8, y + oy + 5, x + ox + 6, y + oy + 11], '#0d0812', 1.4); }
    if (rng() < 0.12) ell(c, x + (rng() - 0.5) * 30, y + (rng() - 0.5) * 12, 5, 2.5, '#1b1326', 0);
  }
  // central seal
  c.lineWidth = 3; c.strokeStyle = 'rgba(91,75,138,0.55)';
  for (const r of [150, 132]) { c.beginPath(); c.ellipse(cx, cy, r, r * ISO, 0, 0, PI2); c.stroke(); }
  for (let k = 0; k < 12; k++) { const a = k / 12 * PI2; stroke(c, [cx + Math.cos(a) * 132, cy + S(a) * 132 * ISO, cx + Math.cos(a) * 150, cy + S(a) * 150 * ISO], 'rgba(91,75,138,0.55)', 2); }
  // warm light near lava edge

  g.addColorStop(0, 'rgba(255,120,30,0)'); g.addColorStop(1, 'rgba(255,120,30,0.2)');
  c.save(); c.translate(0, cy * (1 - ISO)); c.scale(1, ISO); c.fillStyle = g; c.fillRect(0, -h, w, h * 4); c.restore();
  c.restore();
}

/** Shared base for anything standing on the floor (feet-anchored sprite + shadow). */

class Player extends Actor {
  constructor(scene, x, y) {
    super(scene, 'kyra', 48, 42, PLAYER_CFG.scale, 9);
    this.setPosition(x, y);
    this.cfg = PLAYER_CFG; this.maxHp = PLAYER_CFG.maxHp; this.hp = RUN.hp;

    this.iframes = 0; this.specialCd = 0; this.comboStep = -1; this.comboT = 0;

  refreshStats() {
    this.stats = boonStats(RUN.boons);

    if (this.dashCharges > this.maxDash) this.dashCharges = this.maxDash;

  update(dt, input) {
    this.tickFlash(dt);

    if (this.dashCharges < this.maxDash && (this.dashT -= dt) <= 0) { this.dashCharges++; this.dashT = this.cfg.dashRecharge; }
    this.setAlpha(this.iframes > 0 && this.state !== 'dash' && this.state !== 'dead' ? 0.55 + 0.45 * Math.sin(this.scene.clock * 40) : 1);

      if ((this.dustT -= dt) <= 0) { this.dustT = 0.025; this.scene.fx.dust.emitParticleAt(this.x, this.y - 4, 2); }

    } else if (this.state === 'attack') {

      if (!this.hitDone && this.t >= c.hitAt) { this.hitDone = true; this.meleeHit(c); }

    } else if (this.state === 'special') {

      this.setFlipX(Math.floor(this.t / 0.06) % 2 === 0);
      if (!this.hitDone && this.t >= s.hitAt) { this.hitDone = true; this.spinHit(s); }
      if (this.t >= s.time) this.state = 'idle';

  }
  startAttack() {
    this.atkBuf = 0; this.comboStep = this.comboT > 0 ? (this.comboStep + 1) % 3 : 0;

  startSpecial() {

/** Generic enemy: spawn -> chase -> windup -> strike -> recover. Subtypes fill the hooks. */
class Enemy extends Actor {
  constructor(scene, type, cfg) {
    cfg = cfg || ENEMY_CFG[type];
    super(scene, cfg.tex, cfg.frame, cfg.feet, cfg.scale, cfg.radius);
    this.type = type; this.cfg = cfg;
    scene.enemies.add(this);
  }
  spawn(x, y) {
    this.enableBody(true, x, y, true, true);
    this.maxHp = this.cfg.hp; this.hp = this.maxHp; this.state = 'spawn'; this.t = 0.5;
    this.vx = this.vy = this.kx = this.ky = 0; this.cool = 0.4 + Math.random() * 0.8; this.bleedT = 0; this.bleedTick = 0; this.bleedDps = 0;
    this.strafe = Math.random() < 0.5 ? 1 : -1; this.invuln = false;

  }
  get alive() { return this.active && this.state !== 'dead'; }

  update(dt) {

    if (this.bleedT > 0) {
      this.bleedT -= dt;
      if ((this.bleedTick -= dt) <= 0) { this.bleedTick = 0.5; this.takeDamage(Math.max(1, Math.round(this.bleedDps * 0.5)), { kind: 'bleed' }); if (this.state === 'dead') return; }
    }

    this.think(dt, this.scene.player);
    if (this.state === 'dead') return;
    this.setVelocity(this.vx + this.kx, this.vy + this.ky);
    const decay = Math.exp(-9 * dt); this.kx *= decay; this.ky *= decay;
    this.clampToArena(20); this.syncShadow();
  }
  think(dt, p) {
    const c = this.cfg;

      case 'spawn': this.t -= dt; this.setAlpha(1 - Math.max(0, this.t) / 0.5); if (this.t <= 0) this.state = 'chase'; break;
      case 'chase':
        this.setFlipX(p.x < this.x); this.play(c.walk, true); this.moveAI(dt, p); this.cool -= dt;
        if (this.cool <= 0 && p.state !== 'dead' && this.canAttack(p)) { this.state = 'windup'; this.t = c.windup; this.anims.stop(); this.startWindup(p); }
        break;
      case 'windup': this.t -= dt; this.windupTick(1 - this.t / c.windup, p); if (this.t <= 0) { this.state = 'strike'; this.t = c.strikeTime; this.strike(p); } break;

  moveToward(p, speed) { const a = this.angleTo(p); this.vx = Math.cos(a) * speed; this.vy = Math.sin(a) * speed; }
  moveAI() { } canAttack() { return false; } startWindup() { } windupTick() { } strike() { } strikeTick() { }
  takeDamage(amount, o = {}) {
    if (!this.alive || this.invuln) return;
    this.hp -= amount;
    if (o.kind === 'bleed') { this.flashT = 0.08; this.setTint(0xff5555); this.scene.fx.red.emitParticleAt(this.x, this.y - this.hitR, 2); }
    else { this.flash(0.09); this.scene.fx.sparks.emitParticleAt(this.x, this.y - this.displayHeight * 0.4, 6); }
    if (o.knock && !this.cfg.heavy) { this.kx += Math.cos(o.angle) * o.knock; this.ky += Math.sin(o.angle) * o.knock; }
    this.scene.damageNumber(this.x + (Math.random() - 0.5) * 20, this.y - this.displayHeight * 0.75, amount, o.crit ? 'crit' : (o.kind || 'hit'));

  }
  onDamaged() { }
  applyBleed(dps, time) { this.bleedDps = Math.max(this.bleedDps, dps); if (this.bleedT <= 0) this.bleedTick = 0.5; this.bleedT = time; }

  }

class Hoplite extends Enemy {
  constructor(scene) { super(scene, 'hoplite'); }
  moveAI(dt, p) {
    const d = this.distTo(p);
    if (d > this.cfg.range * 0.75) this.moveToward(p, this.cfg.speed);
    const a = this.angleTo(p) + Math.PI / 2 * this.strafe; this.vx += Math.cos(a) * 22; this.vy += Math.sin(a) * 22;
  }
  canAttack(p) { return this.distTo(p) < this.cfg.range; }
  startWindup(p) {
    this.dir = this.angleTo(p); this.setFlipX(Math.cos(this.dir) < 0);
    this.scene.addTelegraph({ type: 'line', x: this.x, y: this.y, angle: this.dir, len: this.cfg.thrustDist + 34, width: 30, dur: this.cfg.windup });
  }

/** The Chimera. Attacks are scripted as lists of timed steps: {t, start, tick, end}. */
class Boss extends Enemy {
  constructor(scene) { super(scene, 'chimera', BOSS_CFG); }
  spawn(x, y) {
    super.spawn(x, y); this.phase = 1; this.steps = null; this.last = ''; this.state = 'spawn'; this.t = 1.2; this.idleT = 1;
    this.play('chimera-idle'); return this;
  }
  think(dt, p) {
    if (this.state === 'spawn') { this.t -= dt; this.setAlpha(1 - Math.max(0, this.t) / 1.2); if (this.t <= 0) this.state = 'idle'; return; }
    if (this.steps) {
      const s = this.steps[this.stepI];
      if (s.tick) s.tick(dt, s);
      if ((s.t -= dt) <= 0) { if (s.end) s.end(); this.nextStep(); }
      return;
    }
    // idle: stalk the player, then pick an attack
    this.setFlipX(p.x < this.x); this.play('chimera-idle', true);
    if (this.distTo(p) > 110) this.moveToward(p, this.cfg.speed * (this.phase === 2 ? 1.4 : 1));
    if ((this.idleT -= dt) <= 0 && p.state !== 'dead') this.pickAttack(p);
  }
  run(steps) { this.steps = steps; this.stepI = -1; this.nextStep(); }
  nextStep() {
    this.stepI++;
    if (this.stepI >= this.steps.length) { this.steps = null; this.idleT = this.cfg.idle[this.phase - 1]; return; }
    const s = this.steps[this.stepI]; s.dur = s.t; if (s.start) s.start(s);
  }
  pickAttack(p) {
    const near = this.distTo(p) < 170;
    let pool = this.phase === 1 ? (near ? ['tail', 'breath', 'charge'] : ['charge', 'breath', 'charge'])
      : (near ? ['tail', 'floor', 'venom', 'multi', 'breath'] : ['multi', 'floor', 'venom', 'breath']);
    pool = pool.filter(a => a !== this.last);
    this.last = pool[Math.floor(Math.random() * pool.length)];
    this.run(this['atk_' + this.last](p));
  }
  face(angle) { this.dir = angle; this.setFlipX(Math.cos(angle) < 0); }
  chargeSteps(p, windup) {
    const c = this.cfg.charge, sc = this.scene;
    return [
      { t: windup, start: () => { this.face(this.angleTo(p)); this.anims.stop(); this.setFrame(4);
          sc.addTelegraph({ type: 'line', x: this.x, y: this.y, angle: this.dir, len: c.speed * c.time + 60, width: c.width, dur: windup }); } },
      { t: c.time, start: () => { this.play('chimera-charge', true); this.hitDone = false; },
        tick: (dt, s) => {
          this.vx = Math.cos(this.dir) * c.speed; this.vy = Math.sin(this.dir) * c.speed;
          sc.fx.dust.emitParticleAt(this.x, this.y, 1);
          if (!this.hitDone && this.distTo(p) < c.hitR) { this.hitDone = true; p.takeDamage(c.dmg); }
          const a = WORLD.A - 40, b = WORLD.B - 22;
          if (Math.abs(this.x + this.vx * dt * 2 - WORLD.cx) / a + Math.abs(this.y + this.vy * dt * 2 - WORLD.cy) / b > 1) { s.t = 0; sc.cameras.main.shake(120, 0.006); }
        } },
    ];
  }
  atk_charge(p) { return [...this.chargeSteps(p, this.cfg.charge.windup), { t: 0.45, start: () => this.play('chimera-idle') }]; }
  atk_multi(p) {
    const w = this.cfg.charge.windupFast;
    return [...this.chargeSteps(p, w + 0.2), ...this.chargeSteps(p, w), ...this.chargeSteps(p, w), { t: 0.6, start: () => this.play('chimera-idle') }];
  }
  atk_breath(p) {
    const c = this.cfg.breath, sc = this.scene;
    return [
      { t: c.windup, start: () => { this.face(this.angleTo(p)); this.anims.stop();
          sc.addTelegraph({ type: 'cone', x: this.x, y: this.y, angle: this.dir, half: c.half, range: c.range, dur: c.windup }); },
        tick: (dt, s) => this.setFrame(s.t > s.dur / 2 ? 8 : 9) },
      { t: c.time, start: s => { this.play('chimera-breath', true); s.tickT = 0; },
        tick: (dt, s) => {
          for (let i = 0; i < 5; i++) { const r = 40 + Math.random() * (c.range - 50), a = this.dir + (Math.random() - 0.5) * 2 * c.half * 0.9; sc.fx.fire.emitParticleAt(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r - 8, 1); }
          if ((s.tickT -= dt) <= 0) {
            s.tickT = c.tick; const d = this.distTo(p);
            if (d < c.range && (d < 40 || angleDiff(this.angleTo(p), this.dir) < c.half)) p.takeDamage(c.dmg);
          }
        } },
      { t: 0.4, start: () => this.play('chimera-idle') },
    ];
  }
  atk_tail(p) {
    const c = this.cfg.tail, sc = this.scene;
    return [
      { t: c.windup, start: () => { this.anims.stop(); sc.addTelegraph({ type: 'circle', x: this.x, y: this.y, r: c.radius, dur: c.windup, color: HEX.spectral }); },
        tick: (dt, s) => this.setFrame(s.t > s.dur / 2 ? 13 : 14) },
      { t: 0.25, start: () => {
          this.setFrame(15); if (inEllipse(p.x, p.y, this.x, this.y, c.radius)) p.takeDamage(c.dmg);
          sc.cameras.main.shake(140, 0.008);
          for (let i = 0; i < 14; i++) { const a = i / 14 * PI2; sc.fx.green.emitParticleAt(this.x + Math.cos(a) * c.radius * 0.85, this.y + Math.sin(a) * c.radius * 0.85 * ISO, 2); }
        }, end: () => this.setFrame(16) },
      { t: 0.35, start: () => this.play('chimera-idle') },
    ];
  }
  atk_venom(p) {
    const c = this.cfg.venom, sc = this.scene;
    const volley = (count, windup) => {
      let base = 0;
      return [
        { t: windup, start: () => { this.face(this.angleTo(p)); base = this.dir; this.anims.stop(); this.setFrame(13);
            for (let i = 0; i < count; i++) sc.addTelegraph({ type: 'line', x: this.x, y: this.y, angle: base + (i / (count - 1) - 0.5) * c.spread, len: 460, width: 8, dur: windup, color: HEX.spectral }); } },
        { t: 0.2, start: () => { this.setFrame(15); for (let i = 0; i < count; i++) sc.fireProjectile(this.x, this.y, base + (i / (count - 1) - 0.5) * c.spread, c.speed, c.dmg, 'venom'); } },
      ];
    };
    return [...volley(c.count, c.windup), ...volley(c.count + 1, c.windup * 0.8), { t: 0.45, start: () => this.play('chimera-idle') }];
  }
  atk_floor(p) {
    const c = this.cfg.floor, sc = this.scene;
    return [
      { t: c.windup, start: () => {
          this.play('chimera-roar', true); sc.cameras.main.shake(300, 0.005);

          else if (pat === 1) for (let k = -4; k <= 4; k++) { const a = uvToWorld(k * 0.21, k * 0.21), b = uvToWorld(k * 0.21, -k * 0.21); pts.push([a.x, a.y + (p.y - WORLD.cy) * 0.5]); if (k) pts.push([b.x + (p.x - WORLD.cx) * 0.5, b.y]); }
          else { pts.push([p.x, p.y]); for (let i = 0; i < 11; i++) { const q = uvToWorld((Math.random() - 0.5) * 1.6, (Math.random() - 0.5) * 1.6); pts.push([q.x, q.y]); } }
          for (const [x, y] of pts) sc.spawnHazard(x, y, c.radius, c.delay, c.burn, c.dmg);
        } },
      { t: 0.5, start: () => this.play('chimera-idle') },
    ];
  }
  onDamaged() {
    if (this.phase === 1 && this.hp > 0 && this.hp <= this.maxHp * this.cfg.phase2At) {

      this.run([{ t: 1.5, start: () => { this.play('chimera-roar', true); sc.cameras.main.shake(900, 0.008); sc.cameras.main.flash(250, 255, 120, 30); },

        end: () => { this.invuln = false; } }]);
    }
  }
  die() {
    this.state = 'dead'; this.steps = null; this.body.enable = false; this.clearTint(); RUN.kills++;
    this.play('chimera-death');
    this.once('animationcomplete', () => { this.setVisible(false); this.shadow.setVisible(false); this.setActive(false); });
    this.scene.onBossDead(this);
  }
}

class Projectile extends Phaser.Physics.Arcade.Image {
  constructor(scene) {
    super(scene, 0, 0, 'orb');
    scene.add.existing(this); scene.physics.add.existing(this);
    this.setOrigin(0.5, 1.5).setBlendMode(Phaser.BlendModes.ADD);
    this.body.setCircle(7, 16 - 7, 48 - 7);
    if (FX_ON) this.postFX.addGlow(0xffffff, 3, 0, false, 0.1, 10);
  }
  fire(x, y, angle, speed, dmg, kind) {
    this.enableBody(true, x, y, true, true);
    this.kind = kind; this.dmg = dmg; this.hostile = true; this.life = 5; this.trailT = 0;
    this.setTint(kind === 'venom' ? 0x9dff3b : HEX.spectral).setScale(kind === 'venom' ? 1.25 : 1).setDepth(9000);
    this.setVelocity(Math.cos(angle) * speed, Math.sin(angle) * speed);
  }
  update(dt) {
    if (!this.active) return;
    if ((this.trailT -= dt) <= 0) { this.trailT = 0.05; (this.hostile ? this.scene.fx.green : this.scene.fx.sparks).emitParticleAt(this.x, this.y - 16, 1); }
    const out = Math.abs(this.x - WORLD.cx) / (WORLD.A + 90) + Math.abs(this.y - WORLD.cy) / (WORLD.B + 60) > 1;
    if ((this.life -= dt) <= 0 || out) this.kill();
  }
  kill(burst) { if (burst) (this.hostile ? this.scene.fx.green : this.scene.fx.sparks).emitParticleAt(this.x, this.y - 16, 8); this.disableBody(true, true); }
}

/** Burning ground patch: telegraphed, then damages while lit. */
class Hazard extends Phaser.Physics.Arcade.Image {
  constructor(scene) {
    super(scene, 0, 0, 'firepool');
    scene.add.existing(this); scene.physics.add.existing(this);
    this.setBlendMode(Phaser.BlendModes.ADD).setDepth(2);
  }
  ignite(x, y, r, delay, burn, dmg) {
    this.enableBody(true, x, y, true, false);
    this.r = r; this.dmg = dmg; this.delay = delay; this.burn = burn; this.armed = false; this.fxT = 0;
    this.setScale(r / 58); this.body.setCircle(58, 64 - 58, 36 - 58);
    this.scene.addTelegraph({ type: 'circle', x, y, r, dur: delay, color: HEX.fire });
  }
  update(dt) {
    if (!this.active) return;
    if (!this.armed) { if ((this.delay -= dt) <= 0) { this.armed = true; this.setVisible(true); this.scene.fx.fire.emitParticleAt(this.x, this.y, 6); } return; }
    this.burn -= dt; this.setAlpha(Math.min(1, this.burn * 2) * (0.8 + 0.2 * Math.sin(this.scene.clock * 18 + this.x)));
    if ((this.fxT -= dt) <= 0) { this.fxT = 0.09; this.scene.fx.fire.emitParticleAt(this.x + (Math.random() - 0.5) * this.r * 1.3, this.y + (Math.random() - 0.5) * this.r * 1.3 * ISO, 1); }
    if (this.burn <= 0) this.disableBody(true, true);
  }
}

function goldText(scene, x, y, str, size, extra = {}) {
  const t = scene.add.text(x, y, str, Object.assign({ fontFamily: FONT, fontSize: size + 'px', fontStyle: 'bold', color: '#ffd24a', stroke: OUT, strokeThickness: Math.max(4, size / 8) }, extra)).setOrigin(0.5);
  const g = t.context.createLinearGradient(0, 0, 0, t.height);
  g.addColorStop(0, '#fff3b0'); g.addColorStop(0.45, '#ffd24a'); g.addColorStop(0.55, '#e0a020'); g.addColorStop(1, '#8a5a0a');
  t.setFill(g); t.setShadow(0, 4, '#000000', 8, true, false);
  return t;
}
function uiText(scene, x, y, str, size, color = '#e8dcc0', extra = {}) {
  return scene.add.text(x, y, str, Object.assign({ fontFamily: FONT, fontSize: size + 'px', color, stroke: OUT, strokeThickness: 3 }, extra)).setOrigin(0.5);
}
function makeButton(scene, x, y, label, cb) {
  const bg = scene.add.rectangle(x, y, 260, 50, 0x2a1f3d).setStrokeStyle(3, 0xd4a017).setInteractive({ useHandCursor: true });
  const tx = uiText(scene, x, y, label, 24, '#ffd24a', { fontStyle: 'bold' });
  bg.on('pointerover', () => { bg.setFillStyle(0x3d2d59); scene.tweens.add({ targets: [bg, tx], scale: 1.06, duration: 100 }); });
  bg.on('pointerout', () => { bg.setFillStyle(0x2a1f3d); scene.tweens.add({ targets: [bg, tx], scale: 1, duration: 100 }); });
  bg.on('pointerdown', cb);
  return bg;
}
/** Shared moody backdrop for menu screens. */
function menuBackdrop(scene, tint = 0x8877aa) {

class BootScene extends Phaser.Scene {
  constructor() { super('Boot'); }
  preload() {
    // PNG overrides: any SHEETS entry with a `url` is loaded from disk instead of generated.
    for (const [key, s] of Object.entries(SHEETS)) if (s.url) this.load.spritesheet(key, s.url, { frameWidth: s.fw, frameHeight: s.fh });
  }
  create() {
    for (const [key, s] of Object.entries(SHEETS)) {
      if (this.textures.exists(key)) continue;
      const tex = this.textures.createCanvas(key, s.fw * s.frames, s.fh), ctx = tex.getContext();
      for (let i = 0; i < s.frames; i++) {
        ctx.save(); ctx.translate(i * s.fw, 0); ctx.beginPath(); ctx.rect(0, 0, s.fw, s.fh); ctx.clip();
        s.draw(ctx, i); ctx.restore();
        tex.add(i, 0, i * s.fw, 0, s.fw, s.fh);
      }
      tex.refresh();
    }
    for (const [key, tex, start, end, frameRate, repeat] of ANIMS)
      this.anims.create({ key, frames: this.anims.generateFrameNumbers(tex, { start, end }), frameRate, repeat });
    if (URLP.get('test') === '1') window.__tests = runTests();
    this.scene.start('Title');
  }
}

    // --- particles ---
    const burst = (tint, extra = {}) => this.add.particles(0, 0, 'spark', Object.assign({ speed: { min: 60, max: 280 }, lifespan: { min: 200, max: 450 }, scale: { start: 1.3, end: 0 }, tint, blendMode: 'ADD', emitting: false }, extra)).setDepth(9050);
    this.fx = {
      sparks: burst(0xffe08a), green: burst(HEX.spectral, { speed: { min: 20, max: 120 } }), red: burst(0xff3b30, { speed: { min: 40, max: 180 }, gravityY: 300 }),
      blue: burst(0x8fc1ff), teal: burst(HEX.teal, { speedY: { min: -160, max: -40 }, speedX: { min: -50, max: 50 }, lifespan: 900 }),
      dust: this.add.particles(0, 0, 'soft', { speed: { min: 10, max: 60 }, lifespan: 420, scale: { start: 0.25, end: 0.7 }, alpha: { start: 0.45, end: 0 }, tint: 0x8d82a8, emitting: false }).setDepth(2),
      smoke: this.add.particles(0, 0, 'soft', { speed: { min: 10, max: 50 }, speedY: { min: -70, max: -20 }, lifespan: 700, scale: { start: 0.4, end: 1.1 }, alpha: { start: 0.6, end: 0 }, tint: HEX.ghost, emitting: false }).setDepth(9000),
      fire: this.add.particles(0, 0, 'soft', { speedX: { min: -25, max: 25 }, speedY: { min: -110, max: -30 }, lifespan: { min: 300, max: 600 }, scale: { start: 0.75, end: 0 }, color: [0xffe066, 0xffb703, 0xff5a00, 0xb3261e], blendMode: 'ADD', emitting: false }).setDepth(9040),

  // ---- helpers ----
  after(sec, fn) { this.timers.push({ t: sec, fn }); }
  banner(text, sec = 1.8) { this.bannerMsg = { text, t: sec, dur: sec }; }

  hitStop(sec) { if (this.hitStopT <= 0) { this.physics.world.pause(); this.anims.pauseAll(); } this.hitStopT = Math.max(this.hitStopT, sec); }
  addTelegraph(t) { t.t = 0; t.color = t.color || HEX.danger; this.telegraphs.push(t); return t; }

  /** Player-sourced damage: crit roll + on-hit boon effects. */
  hitEnemy(e, base, o = {}) {
    if (!e.alive || e.invuln) return false;
    const st = this.player.stats;
    const res = computeDamage({ base, critChance: o.noCrit ? 0 : st.critChance, roll: Math.random() });
    e.takeDamage(res.amount, { crit: res.crit, angle: o.angle, knock: o.knock, kind: o.kind });
    if (st.bleedDps > 0 && !o.kind && e.alive) e.applyBleed(st.bleedDps, st.bleedTime);

  }
  zeusChain(first) {
    const st = this.player.stats; if (!st.chainJumps) return;
    const hit = new Set(); let from = { x: first.x, y: first.y - 420 }, cur = first;
    for (let i = 0; i < st.chainJumps && cur; i++) {
      hit.add(cur);
      const to = { x: cur.x, y: cur.y - cur.displayHeight * 0.4 };
      this.bolts.push({ a: from, b: to, t: 0.2 }); this.fx.blue.emitParticleAt(to.x, to.y, 6);
      this.hitEnemy(cur, st.chainDmg, { kind: 'zeus', noCrit: true });
      from = to; let best = null, bd = 230;
      for (const e of this.liveEnemies()) { if (hit.has(e)) continue; const d = Math.hypot(e.x - cur.x, e.y - cur.y); if (d < bd) { bd = d; best = e; } }
      cur = best;
    }
  }
  reflectProjectiles(p) {
    for (const pr of this.projectiles.getChildren()) {
      if (!pr.active || !pr.hostile || Math.hypot(pr.x - p.x, pr.y - p.y) > 52) continue;
      pr.hostile = false; pr.dmg = p.stats.reflectDmg; pr.life = 4; pr.setTint(HEX.gold);
      let best = null, bd = 1e9; for (const e of this.liveEnemies()) { const d = Math.hypot(e.x - pr.x, e.y - pr.y); if (d < bd) { bd = d; best = e; } }
      const a = best ? Math.atan2(best.y - pr.y, best.x - pr.x) : pr.body.velocity.angle() + Math.PI, sp = pr.body.velocity.length() * 2;
      pr.setVelocity(Math.cos(a) * sp, Math.sin(a) * sp); this.fx.sparks.emitParticleAt(pr.x, pr.y - 16, 10);
    }
  }
  fireProjectile(x, y, angle, speed, dmg, kind) { const pr = this.projectiles.get(); if (pr) pr.fire(x, y, angle, speed, dmg, kind); }
  spawnHazard(x, y, r, delay, burn, dmg) {
    if (Math.abs(x - WORLD.cx) / WORLD.A + Math.abs(y - WORLD.cy) / WORLD.B > 1) return;
    const hz = this.hazards.get(); if (hz) hz.ignite(x, y, r, delay, burn, dmg);
  }
  damageNumber(x, y, amount, kind) {
    const style = { hit: ['#ffffff', 20], crit: ['#ffd24a', 30], bleed: ['#ff5a5a', 16], zeus: ['#8fc1ff', 18], player: ['#ff3b30', 26], heal: ['#2ec4b6', 26] }[kind] || ['#ffffff', 20];
    let t = this.dmgPool.find(d => !d.visible);
    if (!t) { if (this.dmgPool.length >= 48) return; t = this.add.text(0, 0, '', { fontFamily: FONT, fontStyle: 'bold', stroke: OUT, strokeThickness: 4 }).setOrigin(0.5).setDepth(9300); this.dmgPool.push(t); }

  }
  slashFx(p, angle, step) {

    this.tweens.killTweensOf(s);

      .setScale(big ? 0.75 : 0.6, (big ? 0.95 : 0.75) * (step === 1 ? -1 : 1));
    this.tweens.add({ targets: s, scaleX: big ? 1.05 : 0.85, alpha: 0, duration: big ? 240 : 170, ease: 'Quad.out', onComplete: () => s.setVisible(false) });
    const r = big ? 80 : 66;
    for (let i = -2; i <= 2; i++) this.fx.sparks.emitParticleAt(p.x + Math.cos(angle + i * 0.35) * r, p.cy + 6 + Math.sin(angle + i * 0.35) * r, 1);
  }
  spinFx(p, radius) {
    this.tweens.killTweensOf(this.ring);
    this.ring.setPosition(p.x, p.y).setVisible(true).setAlpha(1).setScale(0.2, 0.2 * ISO).setTint(HEX.teal);
    this.tweens.add({ targets: this.ring, scaleX: radius / 118, scaleY: radius / 118 * ISO, alpha: 0, duration: 330, ease: 'Cubic.out', onComplete: () => this.ring.setVisible(false) });
    const s = this.slashes[this.slashI = (this.slashI + 1) % this.slashes.length];
    this.tweens.killTweensOf(s);
    s.setPosition(p.x, p.cy + 6).setVisible(true).setAlpha(1).setTint(HEX.teal).setScale(0.9).setRotation(0);
    this.tweens.add({ targets: s, rotation: PI2 * 1.5, alpha: 0, duration: 340, onComplete: () => s.setVisible(false) });
    for (let i = 0; i < 16; i++) { const a = i / 16 * PI2; this.fx.teal.emitParticleAt(p.x + Math.cos(a) * radius * 0.8, p.y + Math.sin(a) * radius * 0.8 * ISO, 1); }
  }

  // ---- room flow ----
  spawnEnemy(type, x, y) {
    let e = this.enemies.getChildren().find(en => !en.active && en.type === type);
    if (!e) e = new ENEMY_CLASSES[type](this);
    this.fx.smoke.emitParticleAt(x, y - 20, 8);
    return e.spawn(x, y);
  }
  nextWave() {
    this.waveIndex++; this.roomState = 'fighting';
    const wave = this.room.waves[this.waveIndex];
    this.banner(`Onda ${this.waveIndex + 1} de ${this.room.waves.length}`, 1.4);
    let i = 0;
    for (const [type, count] of Object.entries(wave)) for (let n = 0; n < count; n++) {
      let pos, tries = 0;
      do { pos = uvToWorld((Math.random() - 0.5) * 1.6, (Math.random() - 0.5) * 1.6); tries++; }
      while (tries < 40 && (Math.hypot(pos.x - this.player.x, pos.y - this.player.y) < 230 || this.room.columns.some(([u, v]) => { const c = uvToWorld(u, v); return Math.hypot(c.x - pos.x, c.y - pos.y) < 60; })));
      this.pending++;
      this.after(0.15 * i++, () => {
        this.addTelegraph({ type: 'circle', x: pos.x, y: pos.y, r: 30, dur: 0.5, color: HEX.ghost });
        this.after(0.5, () => { this.pending--; this.spawnEnemy(type, pos.x, pos.y); });

  }
  roomCleared() {
    this.roomState = 'cleared'; this.banner('Sala purificada!', 1.6);
    for (const pr of this.projectiles.getChildren()) if (pr.active) pr.kill(true);
    this.after(1.1, () => {
      if (this.player.state === 'dead') return;
      const choices = rollBoonChoices(RUN.boons, 3, Math.random);
      this.bannerMsg = null; this.scene.pause(); this.scene.launch('BoonSelect', { choices });
    });
  }
  /** Called by BoonSelect once the player picks a card. */
  applyBoon(choice) {
    RUN.boons = applyBoonChoice(RUN.boons, choice); RUN.version++;
    this.player.refreshStats(); if (choice.id === 'hermes' && !choice.upgrade) this.player.dashCharges = this.player.maxDash;
    this.fx.sparks.emitParticleAt(this.player.x, this.player.cy, 24);
    this.openDoor();
  }
  openDoor() {
    this.doorOpen = true; this.door.setFrame(1);
    this.tweens.add({ targets: this.doorGlow, alpha: 0.55, duration: 500 });
    this.tweens.add({ targets: this.doorGlow, scaleX: 1.4, duration: 900, yoyo: true, repeat: -1 });
    if (this.room.type !== 'fountain') this.banner('A saída se abriu', 2);
  }
  leaveRoom() {
    this.roomState = 'leaving'; RUN.hp = this.player.hp; RUN.roomIndex++;
    this.cameras.main.fadeOut(300, 13, 8, 18);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.restart());
  }
  onPlayerDeath() {
    this.roomState = 'lost';
    this.after(1.6, () => { this.scene.stop('HUD'); this.scene.start('GameOver', { room: roomLabel(RUN.roomIndex) }); });
  }
  onBossDead(boss) {
    this.roomState = 'won'; this.hitStop(0.25); this.cameras.main.shake(900, 0.012); this.cameras.main.flash(400, 255, 200, 120);
    this.telegraphs.length = 0;
    for (const pr of this.projectiles.getChildren()) if (pr.active) pr.kill(true);
    for (const hz of this.hazards.getChildren()) if (hz.active) hz.disableBody(true, true);
    for (let i = 0; i < 10; i++) this.after(i * 0.14, () => { this.fx.fire.emitParticleAt(boss.x + (Math.random() - 0.5) * 140, boss.y - Math.random() * 110, 8); this.fx.sparks.emitParticleAt(boss.x + (Math.random() - 0.5) * 140, boss.y - Math.random() * 110, 8); });
    this.banner('A Quimera tombou!', 3);
    this.after(3, () => { this.cameras.main.fadeOut(500, 255, 240, 200); this.cameras.main.once('camerafadeoutcomplete', () => { this.scene.stop('HUD'); this.scene.start('Victory'); }); });
  }

  // ---- main loop ----
  update(time, delta) {
    const dt = Math.min(delta, 50) / 1000;
    if (this.hitStopT > 0) { if ((this.hitStopT -= dt) > 0) return; this.physics.world.resume(); this.anims.resumeAll(); }
    this.clock += dt;
    for (let i = this.timers.length - 1; i >= 0; i--) { const tm = this.timers[i]; if ((tm.t -= dt) <= 0) { this.timers.splice(i, 1); tm.fn(); } }
    if (this.bannerMsg && (this.bannerMsg.t -= dt) <= 0) this.bannerMsg = null;

    const k = this.keys, ptr = this.input.activePointer, p = this.player;
    ptr.updateWorldPoint(this.cameras.main);
    if (ptr.leftButtonDown() && p.atkBuf < 0.1) p.atkBuf = 0.1;
    p.update(dt, {
      mx: (k.D.isDown || k.RIGHT.isDown ? 1 : 0) - (k.A.isDown || k.LEFT.isDown ? 1 : 0),
      my: (k.S.isDown || k.DOWN.isDown ? 1 : 0) - (k.W.isDown || k.UP.isDown ? 1 : 0),
      px: ptr.worldX, py: ptr.worldY,
    });
    for (const e of this.enemies.getChildren()) e.update(dt);
    for (const pr of this.projectiles.getChildren()) pr.update(dt);
    for (const hz of this.hazards.getChildren()) hz.update(dt);

    if (this.roomState === 'fighting' && this.pending === 0 && this.liveEnemies().length === 0) {
      this.roomState = 'between';
      if (this.waveIndex + 1 < this.room.waves.length) this.after(0.8, () => this.nextWave()); else this.roomCleared();
    }
    if (this.fountain) {
      const near = !this.fountainUsed && Math.hypot(p.x - WORLD.cx, p.y - WORLD.cy) < 95;
      this.prompt = near ? 'Pressione E para beber da fonte' : null;
      if (near && Phaser.Input.Keyboard.JustDown(k.E)) {
        this.fountainUsed = true; const amt = Math.round(p.maxHp * this.room.healPct); p.heal(amt);
        this.fountain.setFrame(1); this.damageNumber(p.x, p.y - 80, amt, 'heal'); this.fx.teal.emitParticleAt(p.x, p.y - 10, 30); this.cameras.main.flash(200, 46, 196, 182);
      }
    }
    if (this.doorOpen && this.roomState !== 'leaving' && p.state !== 'dead' && Math.hypot(p.x - this.doorPos.x, p.y - this.doorPos.y) < 52) this.leaveRoom();

    this.drawTelegraphs(dt); this.drawBolts(dt); this.drawBars();
    // ambient: fog drift + embers from braziers and lava
    this.fogs.forEach((f, i) => { f.tilePositionX += dt * (6 + i * 7); f.tilePositionY += dt * (2 + i * 2); });
    if ((this.emberT -= dt) <= 0) {
      this.emberT = 0.07;
      const b = this.braziers[Math.floor(Math.random() * this.braziers.length)]; this.fx.embers.emitParticleAt(b.x + (Math.random() - 0.5) * 14, b.y - 44, 1);
      const l = this.rim(Math.random() * PI2, 30 + Math.random() * 50); this.fx.embers.emitParticleAt(l.x, l.y, 1);
    }
  }
  drawTelegraphs(dt) {
    const g = this.teleGfx; g.clear();
    for (let i = this.telegraphs.length - 1; i >= 0; i--) {
      const t = this.telegraphs[i]; t.t += dt;
      if (t.t >= t.dur || (t.follow && t.follow(t) === false)) { this.telegraphs.splice(i, 1); continue; }
      const k = t.t / t.dur, pulse = 0.75 + 0.25 * Math.sin(this.clock * 30);
      if (t.type === 'circle') {
        g.fillStyle(t.color, 0.16); g.fillEllipse(t.x, t.y, t.r * 2, t.r * 2 * ISO);
        g.fillStyle(t.color, 0.3); g.fillEllipse(t.x, t.y, t.r * 2 * k, t.r * 2 * ISO * k);
        g.lineStyle(3, t.color, pulse); g.strokeEllipse(t.x, t.y, t.r * 2, t.r * 2 * ISO);
      } else if (t.type === 'line') {
        const c = Math.cos(t.angle), s = Math.sin(t.angle), nx = -s * t.width / 2, ny = c * t.width / 2;
        const rect = len => [{ x: t.x + nx, y: t.y + ny }, { x: t.x + c * len + nx, y: t.y + s * len + ny }, { x: t.x + c * len - nx, y: t.y + s * len - ny }, { x: t.x - nx, y: t.y - ny }];
        g.fillStyle(t.color, 0.16); g.fillPoints(rect(t.len), true);
        g.fillStyle(t.color, 0.3); g.fillPoints(rect(t.len * k), true);
        g.lineStyle(2, t.color, pulse); g.strokePoints(rect(t.len), true, true);
      } else {

        g.fillStyle(t.color, 0.3); g.fillPoints(fan(t.range * k), true);
        g.lineStyle(3, t.color, pulse); g.strokePoints(fan(t.range), true, true);
      }
    }
  }
  drawBolts(dt) {
    const g = this.boltGfx; g.clear();
    for (let i = this.bolts.length - 1; i >= 0; i--) {
      const b = this.bolts[i]; if ((b.t -= dt) <= 0) { this.bolts.splice(i, 1); continue; }
      const dx = b.b.x - b.a.x, dy = b.b.y - b.a.y, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, n = Math.max(3, Math.floor(len / 28));
      const pts = []; for (let j = 0; j <= n; j++) { const o = j === 0 || j === n ? 0 : (Math.random() - 0.5) * 26; pts.push({ x: b.a.x + dx * j / n + nx * o, y: b.a.y + dy * j / n + ny * o }); }
      const a = Math.min(1, b.t / 0.1);
      g.lineStyle(6, 0x2a5bd7, a * 0.7); g.strokePoints(pts); g.lineStyle(3, 0xbfd9ff, a); g.strokePoints(pts); g.lineStyle(1.2, 0xffffff, a); g.strokePoints(pts);
    }
  }
  drawBars() {
    const g = this.barGfx; g.clear();
    for (const e of this.enemies.getChildren()) {
      if (!e.alive || e === this.boss || e.hp >= e.maxHp) continue;
      const w = 36, x = e.x - w / 2, y = e.y - e.displayHeight * 0.92;
      g.fillStyle(0x0d0812, 0.9); g.fillRect(x - 2, y - 2, w + 4, 8);
      g.fillStyle(e.bleedT > 0 ? 0xff5a5a : HEX.crimson); g.fillRect(x, y, w * Math.max(0, e.hp / e.maxHp), 4);
    }
  }
}

class HUDScene extends Phaser.Scene {
  constructor() { super('HUD'); }
  create() {
    if (!FX_ON) this.add.image(W / 2, H / 2, 'vignette');
    this.g = this.add.graphics();
    this.hpText = uiText(this, 134, H - 45, '', 15, '#ffffff', { fontStyle: 'bold' });
    this.add.text(24, H - 78, 'KYRA', { fontFamily: FONT, fontSize: '15px', fontStyle: 'bold', color: '#ffd24a', stroke: OUT, strokeThickness: 3 });
    this.specText = this.add.text(150, H - 26, 'GIRO', { fontFamily: FONT, fontSize: '12px', fontStyle: 'bold', color: '#2ec4b6', stroke: OUT, strokeThickness: 3 });
    this.roomText = this.add.text(W - 22, 16, '', { fontFamily: FONT, fontSize: '22px', fontStyle: 'bold', color: '#ffd24a', stroke: OUT, strokeThickness: 4 }).setOrigin(1, 0);
    this.bannerText = goldText(this, W / 2, 128, '', 36).setAlpha(0);
    this.promptText = uiText(this, W / 2, H - 110, '', 20, '#8ff0e6').setVisible(false);
    this.bossName = uiText(this, W / 2, 26, `${BOSS_CFG.name} — ${BOSS_CFG.title}`, 20, '#ffb703', { fontStyle: 'bold' }).setVisible(false);
    this.arrow = this.add.triangle(0, 0, 0, -9, 20, 0, 0, 9, HEX.teal).setStrokeStyle(2, 0x0d0812).setVisible(false);
    this.boonIcons = []; this.version = -1; this.bossShown = 0;
  }
  rebuildBoons() {
    this.boonIcons.forEach(o => o.destroy()); this.boonIcons = [];
    Object.entries(RUN.boons).forEach(([id, b], i) => {
      const x = 40 + i * 54, y = 40, col = Phaser.Display.Color.HexStringToColor(RARITIES[b.rarity].color).color;
      this.boonIcons.push(this.add.circle(x, y, 23, 0x0d0812).setStrokeStyle(3, col), this.add.image(x, y, BOONS[id].icon).setScale(0.62),
        this.add.text(x + 12, y + 10, 'Nv' + b.level, { fontFamily: FONT, fontSize: '13px', fontStyle: 'bold', color: '#ffffff', stroke: OUT, strokeThickness: 4 }));
    });
  }
  update() {
    const game = this.scene.get('Game'), p = game.player; if (!p || !p.scene) return;
    if (this.version !== RUN.version) { this.version = RUN.version; this.rebuildBoons(); }
    const g = this.g; g.clear();
    // health
    const x = 24, y = H - 56, w = 220, h = 22, k = p.hp / p.maxHp;
    g.fillStyle(0x0d0812); g.fillRect(x - 4, y - 4, w + 8, h + 8);
    g.fillStyle(0x3a1014); g.fillRect(x, y, w, h);
    g.fillStyle(k > 0.3 ? HEX.crimson : 0xff3b30); g.fillRect(x, y, w * k, h);
    g.fillStyle(0xffffff, 0.18); g.fillRect(x, y, w * k, 7);
    g.lineStyle(2, 0xd4a017); g.strokeRect(x - 2, y - 2, w + 4, h + 4);
    this.hpText.setText(`${Math.ceil(p.hp)} / ${p.maxHp}`);
    // dash pips
    for (let i = 0; i < p.maxDash; i++) {
      const cx = x + 12 + i * 30, cy = H - 18, full = i < p.dashCharges;
      const pts = [{ x: cx, y: cy - 9 }, { x: cx + 11, y: cy }, { x: cx, y: cy + 9 }, { x: cx - 11, y: cy }];
      g.fillStyle(0x0d0812); g.fillPoints(pts.map(q => ({ x: cx + (q.x - cx) * 1.3, y: cy + (q.y - cy) * 1.3 })), true);
      g.fillStyle(full ? HEX.teal : 0x24424a); g.fillPoints(pts, true);
    }
    // special cooldown
    const sk = 1 - Phaser.Math.Clamp(p.specialCd / p.cfg.special.cooldown, 0, 1);
    g.fillStyle(0x0d0812); g.fillRect(148, H - 12, 96, 8);
    g.fillStyle(sk >= 1 ? HEX.teal : 0x24747a); g.fillRect(150, H - 10, 92 * sk, 4);
    this.specText.setAlpha(sk >= 1 ? 1 : 0.5);
    this.roomText.setText(roomLabel(RUN.roomIndex));
    // boss bar
    const boss = game.boss, show = boss && boss.alive;
    this.bossName.setVisible(!!show);
    if (show) {
      const bw = 420, bx = W / 2 - bw / 2, by = 44, bk = Math.max(0, boss.hp / boss.maxHp);
      this.bossShown += (bk - this.bossShown) * 0.12;
      g.fillStyle(0x0d0812); g.fillRect(bx - 4, by - 4, bw + 8, 22);
      g.fillStyle(0x3a1014); g.fillRect(bx, by, bw, 14);
      g.fillStyle(0xffe066); g.fillRect(bx, by, bw * this.bossShown, 14);
      g.fillStyle(boss.phase === 2 ? 0xff5a00 : HEX.crimson); g.fillRect(bx, by, bw * bk, 14);
      g.lineStyle(2, 0xd4a017); g.strokeRect(bx - 2, by - 2, bw + 4, 18);
      g.fillStyle(0xffd24a); g.fillRect(bx + bw * BOSS_CFG.phase2At - 1, by - 3, 2, 20);
    } else this.bossShown = 1;
    // banner / prompt / exit arrow
    const b = game.bannerMsg;
    if (b) { if (this.bannerText.text !== b.text) this.bannerText.setText(b.text); this.bannerText.setAlpha(Math.min(1, b.t * 3, (b.dur - b.t) * 5 + 0.1)); } else this.bannerText.setAlpha(0);
    this.promptText.setVisible(!!game.prompt); if (game.prompt) this.promptText.setText(game.prompt);
    const cam = game.cameras.main;
    this.arrow.setVisible(!!game.doorOpen && p.state !== 'dead');
    if (game.doorOpen) {
      const a = Math.atan2(game.doorPos.y - p.y, game.doorPos.x - p.x), bob = 62 + Math.sin(game.clock * 6) * 5;
      this.arrow.setPosition(p.x - cam.scrollX + Math.cos(a) * bob, p.y - 26 - cam.scrollY + Math.sin(a) * bob).setRotation(a);
    }
  }
}

class BoonSelectScene extends Phaser.Scene {
  constructor() { super('BoonSelect'); }
  create(data) {
    this.picked = false;
    const dim = this.add.rectangle(W / 2, H / 2, W, H, 0x0d0812, 0).setInteractive();
    this.tweens.add({ targets: dim, fillAlpha: 0.78, duration: 250 });
    const title = goldText(this, W / 2, 52, 'Os deuses oferecem uma bênção', 34).setAlpha(0);
    this.tweens.add({ targets: title, alpha: 1, duration: 400 });
    this.cards = data.choices.map((ch, i) => this.makeCard(ch, i));
    this.input.keyboard.on('keydown', ev => { const n = ['1', '2', '3'].indexOf(ev.key); if (n >= 0 && this.cards[n]) this.pick(n); });
    uiText(this, W / 2, H - 18, 'Clique em uma carta (ou teclas 1, 2, 3)', 15, '#c9b8e8');
  }
  makeCard(ch, i) {
    const boon = BOONS[ch.id], rar = RARITIES[ch.rarity], x = W / 2 + (i - 1) * 250, y = H / 2 + 22;
    const stats = boonStats({ [ch.id]: { rarity: ch.rarity, level: ch.level } });
    const col = '#' + boon.color.toString(16).padStart(6, '0');
    const bg = this.add.image(0, 0, 'card').setInteractive({ useHandCursor: true });
    const band = this.add.rectangle(0, -86, 196, 100, boon.color, 0.55);
    const halo = this.add.image(0, -86, 'glow').setScale(0.6).setTint(boon.color).setBlendMode('ADD').setAlpha(0.8);
    const icon = this.add.image(0, -86, boon.icon).setScale(1.35);
    const parts = [bg, band, halo, icon,
      uiText(this, 0, -22, boon.god.toUpperCase(), 24, '#ffd24a', { fontStyle: 'bold' }),
      uiText(this, 0, 4, boon.title, 17, '#e8dcc0', { fontStyle: 'italic' }),
      uiText(this, 0, 28, `${rar.label}  •  Nível ${ch.level}`, 15, rar.color, { fontStyle: 'bold' }),
      uiText(this, 0, 74, boon.desc(stats), 15, '#ffffff', { align: 'center', wordWrap: { width: 180 }, strokeThickness: 2 }),
    ];
    if (ch.upgrade) parts.push(uiText(this, 0, 118, '▲ APRIMORAMENTO', 14, '#a6ff4d', { fontStyle: 'bold' }));
    else parts.push(uiText(this, 0, 118, 'NOVA BÊNÇÃO', 13, col === '#8a1414' ? '#ff6a5a' : '#c9b8e8', { fontStyle: 'bold' }));
    const card = this.add.container(x, y + 520, parts);
    this.tweens.add({ targets: card, y, duration: 520, delay: 120 + i * 110, ease: 'Back.out' });
    this.tweens.add({ targets: icon, y: -92, duration: 1100 + i * 150, yoyo: true, repeat: -1, ease: 'Sine.inOut' });
    this.tweens.add({ targets: halo, scale: 0.75, alpha: 0.45, duration: 900, yoyo: true, repeat: -1 });
    bg.on('pointerover', () => { if (!this.picked) this.tweens.add({ targets: card, scale: 1.07, duration: 120 }); });
    bg.on('pointerout', () => { if (!this.picked) this.tweens.add({ targets: card, scale: 1, duration: 120 }); });
    bg.on('pointerdown', () => this.pick(i));
    card.choice = ch;
    return card;
  }
  pick(n) {
    if (this.picked) return; this.picked = true;
    this.cards.forEach((c, i) => {
      if (i === n) this.tweens.add({ targets: c, scale: 1.18, y: c.y - 14, duration: 260, ease: 'Back.out' });
      else this.tweens.add({ targets: c, alpha: 0, y: c.y + 60, duration: 220 });
    });
    this.time.delayedCall(520, () => {
      const game = this.scene.get('Game');
      this.scene.stop(); this.scene.resume('Game'); game.applyBoon(this.cards[n].choice);
    });
  }
}

function runSummary(scene, y) {
  const secs = Math.floor((Date.now() - RUN.startTime) / 1000), mm = Math.floor(secs / 60), ss = String(secs % 60).padStart(2, '0');
  uiText(scene, W / 2, y, `Tempo: ${mm}:${ss}   •   Inimigos derrotados: ${RUN.kills}`, 20, '#e8dcc0');
  const ids = Object.keys(RUN.boons), x0 = W / 2 - (ids.length - 1) * 34;
  ids.forEach((id, i) => { scene.add.image(x0 + i * 68, y + 50, BOONS[id].icon).setScale(0.75); uiText(scene, x0 + i * 68, y + 84, 'Nv ' + RUN.boons[id].level, 14, RARITIES[RUN.boons[id].rarity].color, { fontStyle: 'bold' }); });
}
